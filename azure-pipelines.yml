name: FUntionProj_$(Date:yyyyMMdd)_$(Rev:.r)

trigger:
- main

stages:
- stage: Build
  jobs:
  - job: Build
  pool:
    vmImage: windows-latest

    steps:
    - task: VSBuild@1
      inputs:
        solution: '**\*.sln'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:PackageLocation="$(Build.ArtifactStagingDirectory)"'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

    - task: ArchiveFiles@2
      inputs:
        displayName: "Archive files" 
        rootFolderOrFile: "$(System.ArtifactStagingDirectory)"  
        includeRootFolder: false
        archiveFile: "$(System.ArtifactStagingDirectory)/build$(Build.BuildId).zip"

    - publish: "$(System.ArtifactStagingDirectory)/build$(Build.BuildId).zip"
      artifact: 'drop'  


- stage: Deployment
  jobs:
  - job: DeploymentonAzureFuntion
    pool:
      vmImage: windows-latest

    steps:

    - powershell: "Write-Host"
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        buildVersionToDownload: 'latest'
        downloadType: 'specific'
        downloadPath: "$(System.ArtifactStagingDirectory)'/build$(Build.BuildId).zip"

    - publish: "$(System.ArtifactStagingDirectory)/build$(Build.BuildId).zip"
      artifact: 'drop'    

    - task: AzureFunctionApp@2
      inputs:
        connectedServiceNameARM: 'Azure subscription 1(f4fb6362-0022-4285-bea3-8447ee34fc97)'
        appType: 'functionApp'
        appName: 'First-AzureFuntion1'
        package: '$(System.ArtifactStagingDirectory)/**/*.zip'
        deploymentMethod: 'zipDeploy'