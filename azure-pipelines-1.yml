name: Dotnetapplication_$(Date:yyyyMMdd)_$(Rev:.r)

trigger:
- main

stages:
- stage: Build
  jobs:
  - job: Build
  pool:
    name: Default

    steps:
    - task: VSBuild@1
      inputs:
        solution: '**\*.sln'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:PackageLocation="$(Build.ArtifactStagingDirectory)"'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deployment
  jobs:
  - job: DeploymentonAzureFuntion
    pool:
      name: Default

    steps:

    - powershell: "Write-Host"
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        #buildVersionToDownload: 'latest'
        downloadType: 'specific'
        downloadPath: '$(System.DefaultWorkingDirectory)'

    - task: AzureFunctionApp@2
      inputs:
        connectedServiceNameARM: 'Azure subscription 1(f4fb6362-0022-4285-bea3-8447ee34fc97)'
        appType: 'functionApp'
        appName: 'First-AzureFuntion'
        package: '$(System.DefaultWorkingDirectory)/**/*.zip'
        deploymentMethod: 'auto'
